name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Testes (unit + statistical + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependências
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Testes (paridade R é pulada neste job)
        run: python -m pytest -q -m "not r_parity"

  r-parity:
    name: Paridade com R/mirt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true
      - name: Pacotes R
        run: Rscript -e 'install.packages(c("mirt","jsonlite","lavaan"))'
      - name: Dependências Python
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Paridade Python × mirt
        run: python -m pytest -q -m r_parity -rs
