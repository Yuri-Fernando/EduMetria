name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Testes (unit + statistical + integration + PostgreSQL/RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edumetria_admin
          POSTGRES_PASSWORD: admin_local_only
          POSTGRES_DB: edumetria
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U edumetria_admin -d edumetria" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependências
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Papel da aplicação sem BYPASSRLS (mesmo script do compose)
        run: PGPASSWORD=admin_local_only psql -h localhost -p 15432 -U edumetria_admin -d edumetria -f infra/postgres/init.sql
      - name: Testes (paridade R é pulada neste job; PostgreSQL/RLS obrigatório)
        env:
          EDUMETRIA_REQUIRE_PG: "1"
        run: python -m pytest -q -m "not r_parity"

  r-parity:
    name: Paridade com R/mirt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Pacotes R
        run: Rscript -e 'install.packages(c("Deriv","mirt","jsonlite","lavaan"))'
      - name: Verificar mirt (falha se ausente — paridade não pode ser pulada em silêncio)
        run: Rscript -e 'stopifnot(requireNamespace("mirt", quietly = TRUE)); print(packageVersion("mirt"))'
      - name: Dependências Python
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Paridade Python × mirt
        env:
          EDUMETRIA_REQUIRE_R: "1"
        run: python -m pytest -q -m r_parity -rs
