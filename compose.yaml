# EduMetria — perfis locais (sem custo). Nada aqui é publicado externamente.
#   docker compose --profile core up -d            # PostgreSQL com RLS
#   docker compose --profile observability up -d   # OTel Collector + Jaeger + Prometheus + Grafana
# Credenciais abaixo são SOMENTE para ambiente local de demonstração.
services:
  postgres:
    profiles: ["core"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edumetria_admin
      POSTGRES_PASSWORD: admin_local_only
      POSTGRES_DB: edumetria
    ports: ["${EDUMETRIA_PG_PORT:-15432}:5432"]  # porta fora das faixas reservadas pelo Windows (Hyper-V)
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumetria_admin -d edumetria"]
      interval: 3s
      retries: 20

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
    depends_on: [jaeger]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]
